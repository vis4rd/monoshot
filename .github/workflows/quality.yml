name: Code Quality

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - src/**/*.hpp
      - src/**/*.cpp
      - src/**/*.inl
      - src/**/*.c
      - src/**/*.h
      - .clang-tidy
      - .clang-format
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/vis4rd/monoshot:pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files (for triggering)
        id: changed-files-trigger
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/**.hpp
            src/**.cpp
            src/**.inl
            src/**.c
            src/**.h
            .clang-format

      - name: Get changed files (for formatting)
        id: changed-files-format
        uses: tj-actions/changed-files@v45
        if: steps.changed-files-trigger.outputs.any_changed == 'true'
        with:
          files: |
            src/**.hpp
            src/**.cpp
            src/**.inl
            src/**.c
            src/**.h

      - name: Check code formatting
        if: steps.changed-files-trigger.outputs.any_changed == 'true'
        shell: bash
        run: |
          echo "Files selected for formatting check:"
          echo ${{ steps.changed-files-format.outputs.all_changed_files }}

          clang-format --dry-run --Werror ${{ steps.changed-files-format.outputs.all_changed_files }}

          if [ $? -eq 0 ]; then echo "Code formatting check passed."; exit 0;
          else echo "Code formatting check failed."; exit 1;
          fi

  clang-tidy:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/vis4rd/monoshot:latest

    if: ${{ github.event.pull_request.draft == false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare environment
        id: env
        uses: ./.github/actions/prepare_env

      - name: Get files in pull request
        id: get-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # TODO: replace api call with changed-files action
        # TODO: remove curl and jq from Dockerfile installation after
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            | jq -r '.[] | select(.status != "removed") | .filename' > pr_files.txt

      - name: List files to check with clang-tidy
        id: list-files
        shell: bash
        run: |
          echo "All files changed in this pull request:"
          cat pr_files.txt
          grep -E '.+\.(hpp|cpp|inl|c|h)$' pr_files.txt > files.txt

          echo "Files selected for clang-tidy check:"
          cat files.txt
        continue-on-error: true

      - name: Run clang-tidy
        if: ${{ steps.list-files.outcome == 'success' }}
        shell: bash
        run: |
          cat files.txt | xargs clang-tidy --quiet --config-file=.clang-tidy -p=${{ github.workspace }}/build
